    // --- GESTION DU DÉGRADÉ PERSONNALISABLE AVEC SAUVEGARDE ---
    const GRADIENT_STORAGE_KEY = "cforcode_gradient_theme_v1";
    const DEFAULT_GRADIENT = {
      c1: "#0f172a",
      c2: "#1e3a8a",
      accent: "#38bdf8",
      angle: "135deg"
    };

    const gradColor1Input = document.getElementById("grad-color-1");
    const gradColor2Input = document.getElementById("grad-color-2");
    const gradAccentInput = document.getElementById("grad-accent");
    const gradAngleSelect = document.getElementById("grad-angle");
    const gradientPopover = document.getElementById("gradient-popover");
    const gradSaveStatus = document.getElementById("grad-save-status");

    function hexToRgba(hex, alpha) {
      const clean = hex.replace("#", "");
      const num = parseInt(clean, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyGradientConfig(cfg, save = true) {
      const root = document.documentElement.style;
      root.setProperty("--grad-c1", cfg.c1);
      root.setProperty("--grad-c2", cfg.c2);
      root.setProperty("--grad-angle", cfg.angle);
      root.setProperty("--bg-main", cfg.c1);
      root.setProperty("--bg-panel", hexToRgba(cfg.c1, 0.82));
      root.setProperty("--bg-elevated", hexToRgba(cfg.c2, 0.42));
      root.setProperty("--accent", cfg.accent);
      root.setProperty("--accent-soft", hexToRgba(cfg.accent, 0.16));
      root.setProperty("--border", hexToRgba(cfg.accent, 0.3));

      gradColor1Input.value = cfg.c1;
      gradColor2Input.value = cfg.c2;
      gradAccentInput.value = cfg.accent;
      gradAngleSelect.value = cfg.angle;

      if (save) {
        try {
          localStorage.setItem(GRADIENT_STORAGE_KEY, JSON.stringify(cfg));
          gradSaveStatus.textContent = "Sauvegardé ✓";
        } catch (e) {
          gradSaveStatus.textContent = "Session locale";
        }
      }
    }

    function loadSavedGradient() {
      try {
        const raw = localStorage.getItem(GRADIENT_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          applyGradientConfig({ ...DEFAULT_GRADIENT, ...parsed }, false);
          return;
        }
      } catch (e) {}
      applyGradientConfig(DEFAULT_GRADIENT, false);
    }

    function handleGradientInputChange() {
      applyGradientConfig({
        c1: gradColor1Input.value,
        c2: gradColor2Input.value,
        accent: gradAccentInput.value,
        angle: gradAngleSelect.value
      }, true);
    }

    gradColor1Input.addEventListener("input", handleGradientInputChange);
    gradColor2Input.addEventListener("input", handleGradientInputChange);
    gradAccentInput.addEventListener("input", handleGradientInputChange);
    gradAngleSelect.addEventListener("change", handleGradientInputChange);

    document.querySelectorAll(".preset-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        applyGradientConfig({
          c1: btn.dataset.c1,
          c2: btn.dataset.c2,
          accent: btn.dataset.acc,
          angle: btn.dataset.ang
        }, true);
        logToConsole("Préréglage de dégradé appliqué et sauvegardé.", "sys");
      });
    });

    document.getElementById("btn-reset-gradient").addEventListener("click", () => {
      try {
        localStorage.removeItem(GRADIENT_STORAGE_KEY);
      } catch (e) {}
      applyGradientConfig(DEFAULT_GRADIENT, false);
      gradSaveStatus.textContent = "Réinitialisé (défaut)";
      logToConsole("Dégradé bleu par défaut restauré.", "sys");
    });

    document.getElementById("btn-toggle-gradient").addEventListener("click", (e) => {
      e.stopPropagation();
      gradientPopover.classList.toggle("open");
    });

    document.getElementById("btn-close-gradient").addEventListener("click", () => {
      gradientPopover.classList.remove("open");
    });

    document.addEventListener("click", (e) => {
      if (!gradientPopover.contains(e.target) && e.target.id !== "btn-toggle-gradient") {
        gradientPopover.classList.remove("open");
      }
    });

    // Charger le thème sauvegardé dès le démarrage
    loadSavedGradient();

    // Écouteurs des boutons
    document.getElementById("btn-start-demo").addEventListener("click", () => startEditor("demo"));
    document.getElementById("btn-start-empty").addEventListener("click", () => startEditor("empty"));
    document.getElementById("btn-home").addEventListener("click", () => bootScreen.classList.remove("hidden"));
    document.getElementById("btn-mode").addEventListener("click", () => bootScreen.classList.remove("hidden"));
    document.getElementById("btn-run").addEventListener("click", runPreview);
    document.getElementById("btn-download").addEventListener("click", downloadProject);
    document.getElementById("btn-new-file").addEventListener("click", openCreateModal);
    document.getElementById("btn-empty-new").addEventListener("click", openCreateModal);
    document.getElementById("btn-import-file").addEventListener("click", triggerFileImport);
    document.getElementById("btn-empty-import").addEventListener("click", triggerFileImport);
    document.getElementById("btn-modal-cancel").addEventListener("click", closeModal);
    document.getElementById("btn-modal-confirm").addEventListener("click", confirmModal);
    document.getElementById("btn-clear-console").addEventListener("click", () => {
      consoleLogsEl.innerHTML = "";
    });
  </script>
