<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CforCode</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRi2US0LNAcSnlT_o4cPLtU3J2JDnACDZatDH3Gp__pMg&s=10">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f4f9;
            color: #333;
            box-sizing: border-box;
            gap: 25px;
        }

        .logo {
            max-width: 250px;
            height: auto;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            text-align: center;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            color: #444;
        }

        .card h3 {
            font-size: 1.1rem;
            color: #555;
            margin: 15px 0 10px 0;
            text-align: left;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-disabled {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            object-fit: contain;
        }

        /* Bouton AGV avec dégradé violet vers rose (gauche à droite) */
        .btn-agv {
            background: linear-gradient(to right, #6a11cb, #2575fc, #ff758c); /* Dégradé violet/bleu vers rose */
            background: linear-gradient(to right, #8a2be2, #ff69b4); /* Violet classique (#8a2be2) vers Rose vif (#ff69b4) */
            color: white;
            font-weight: bold;
        }

        /* Bouton Portfolio au style dessiné à la main (effet sketchy) */
        .btn-portfolio {
            background-color: #fffdf0;
            color: #2c2c2c;
            border: 2px dashed #333;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; /* Forme organique/irrégulière */
            font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
            box-shadow: 2px 3px 0px rgba(0,0,0,0.8);
            transform: rotate(-0.5deg);
        }

        .btn-portfolio:hover {
            background-color: #fff9c4;
            transform: rotate(0.5deg) scale(1.02);
        }

        .separator {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <img src="https://raw.githubusercontent.com/progra31/CforCode/0175baecfc2932a7bdb549834f007b05d973f68d/icones/logo%20principal.png" alt="Logo CforCode" class="logo">

    <h1>Bienvenue sur le site officiel de <strong>CforCode</strong></h1>
    
    <!-- Carte Projets principale -->
    <div class="card">
        <h2>Projets</h2>
        <div class="button-container">
            <a href="https://cforcode.cforcode.workers.dev/xp-computer/" class="btn" target="_blank">
                <img src="https://raw.githubusercontent.com/progra31/CforCode/b9cf8c15137952f12ed20a31a24230dee62666df/icones/icone%20ordi%20web.png" alt="" class="btn-icon">
                ordinateur web
            </a>
            <a href="https://cforcode.cforcode.workers.dev/super-pannel" class="btn" target="_blank">
                <img src="https://raw.githubusercontent.com/progra31/CforCode/405ac6c2ca93b54c8bbb102df28352e79bc2e100/icones/icone%20super%20pannel.png" alt="" class="btn-icon">
                super pannel
            </a>
            <a href="https://cforcode.cforcode.workers.dev/code-editor/" class="btn" target="_blank">
                <img src="https://raw.githubusercontent.com/progra31/CforCode/29b96fa79e3ae469d712bdf98046345462d7789c/icones/code%20editor%20icone.png" alt="" class="btn-icon">
                CforCodeEditor
            </a>
        </div>
    </div>

    <!-- Carte Autres projets -->
    <div class="card">
        <h2>Autres projets</h2>
        
        <h3>Sites web</h3>
        <div class="button-container">
            <a href="https://agv.plaine-de-riviere.workers.dev/" class="btn btn-agv" target="_blank">AGV plaine de rivière</a>
            <a href="https://julie.taraire.workers.dev/" class="btn btn-portfolio" target="_blank">portfolio</a>
        </div>

        <hr class="separator">

        <h3>Apps</h3>
        <div class="button-container">
            <a href="#" class="btn btn-disabled">bientôt</a>
        </div>
    </div>

</body>
</html>
